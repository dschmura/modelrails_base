# Lefthook git hooks: the local half of CI, never skipped — see /docs/developer/getting-started (Gate 1).
# A push with no changed files to check (a rebase replay) runs none of them but docker_build; CI is the gate then.

pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.rb"
      run: mise exec -- bundle exec rubocop --force-exclusion --autocorrect {staged_files}
      stage_fixed: true
    comment_blocks:
      glob: "*.{rb,rake,erb,js,css,yml,yaml}"
      run: mise exec -- bin/comment-block-check {staged_files}
    schema_parity:
      glob: "db/schema.rb"
      run: mise exec -- bin/rails runner spec/migrations/support/fresh_migrate_probe.rb

pre-push:
  # piped runs commands by priority (alphabetically without one; unset = last): the stylesheet
  # must be built before rspec's system specs read it, and the slow image build goes last.
  piped: true
  commands:
    tailwind_build:
      tags: assets
      priority: 1
      run: mise exec -- bin/rails tailwindcss:build
      skip:
        - merge
        - rebase
    brakeman:
      tags: security
      priority: 2
      run: mise exec -- bundle exec brakeman --no-pager -q
      skip:
        - merge
        - rebase
    bundler_audit:
      # CI's scan_ruby job runs brakeman AND bundler-audit, but Lefthook only
      # ran brakeman — so a fresh transitive-gem CVE (no code change) turned
      # scan_ruby red on a green-locally branch repeatedly (nokogiri + faraday,
      # PR #371). Same bin/bundler-audit + config CI uses (vendored advisory DB,
      # no network --update), so local and CI verdicts match.
      # scan_js is deliberately not mirrored: it POSTs to the npm registry (#984).
      tags: security
      priority: 3
      run: mise exec -- bin/bundler-audit
      skip:
        - merge
        - rebase
    rubocop:
      tags: style
      priority: 4
      run: mise exec -- bundle exec rubocop -f simple
      skip:
        - merge
        - rebase
    erb_lint:
      # Matches CI's lint_docs job. Runs erb_lint (Ruby gem, config in
      # .erb_lint.yml) — replaced the npm @herb-tools/linter package, whose
      # own Ruby CLI wrapper still delegated to Node under the hood, so it
      # never actually removed the Node dependency it appeared to.
      tags: style
      priority: 5
      run: mise exec -- bundle exec rake erb:check
      skip:
        - merge
        - rebase
    markdown_lint:
      # Mirrors CI's lint_docs job (`bundle exec rake markdown:check`). Was
      # absent locally until #193 caught a trailing-space MD009 violation in
      # workspaces.md — same drift pattern as PR #78's erb_lint miss
      # (see memory: project_ci_lefthook_drift). Markdownlint runs in <1s,
      # so this adds negligible push latency.
      tags: style
      priority: 6
      run: mise exec -- bundle exec rake markdown:check
      skip:
        - merge
        - rebase
    rspec:
      tags: test
      priority: 7
      env:
        CI: "true"
      # bin/parallel-rspec = full suite across all cores + integrity gates
      # (example-count parity, merged coverage floor). Same gates as CI's test
      # job. Worker count: PARALLEL_TEST_PROCESSORS env or core count.
      run: mise exec -- bin/parallel-rspec
      skip:
        - merge
        - rebase
    docker_build:
      tags: build
      # Diffed against main, not the push range, so a rebase replay still builds.
      # Same inputs as docker_build.yml's paths.
      files: git diff --name-only origin/main...HEAD
      glob: "{Dockerfile,.dockerignore,Gemfile,Gemfile.lock,.tool-versions,bin/docker-entrypoint}"
      run: mise exec -- bin/docker-build-check
      skip:
        - merge
        - rebase
