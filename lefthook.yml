# Lefthook git hooks: the local half of CI, never skipped — see /docs/developer/getting-started (Gate 1).
# A push with no changed files to check (a rebase replay) runs none of them but docker_build; CI is the gate then.

pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.rb"
      run: mise exec -- bundle exec rubocop --force-exclusion --autocorrect {staged_files}
      stage_fixed: true
    comment_blocks:
      glob: "*.{rb,rake,erb,js,css,yml,yaml}"
      run: mise exec -- bin/comment-block-check {staged_files}
    yaml_syntax:
      glob: "*.{yml,yaml}"
      run: mise exec -- bin/yaml-check {staged_files}
    schema_parity:
      glob: "db/schema.rb"
      run: mise exec -- bin/rails runner spec/migrations/support/fresh_migrate_probe.rb

pre-push:
  # piped runs commands by priority (alphabetically without one; unset = last): the stylesheet
  # must be built before rspec's system specs read it, and the slow image build goes last.
  piped: true
  commands:
    protected_branch:
      priority: 1
      use_stdin: true
      run: mise exec -- bin/protected-branch-check {1}
    tailwind_build:
      tags: assets
      priority: 2
      run: mise exec -- bin/rails tailwindcss:build
      skip:
        - merge
        - rebase
    brakeman:
      tags: security
      priority: 3
      run: mise exec -- bundle exec brakeman --no-pager -q
      skip:
        - merge
        - rebase
    bundler_audit:
      # Updates the advisory DB first, as CI's fresh clone does, so the verdicts match (#371, #1424); offline it fails.
      # The importmap audit is deliberately not mirrored: it POSTs to the npm registry (#984).
      tags: security
      priority: 4
      files: bin/branch-changes
      glob: "{Gemfile.lock,hotcell/Gemfile.lock}"
      run: mise exec -- bin/bundler-audit check --update && mise exec -- bin/bundler-audit check hotcell
      skip:
        - merge
        - rebase
    rubocop:
      tags: style
      priority: 5
      run: mise exec -- bundle exec rubocop -f simple
      skip:
        - merge
        - rebase
    erb_lint:
      # Matches CI's static job (rake erb:check). erb_lint is a Ruby gem: the npm linter it replaced needed Node.
      tags: style
      priority: 6
      files: bin/branch-changes
      glob: "*.erb"
      run: mise exec -- bundle exec rake erb:check
      skip:
        - merge
        - rebase
    markdown_lint:
      # Mirrors CI's static job (rake markdown:check); missing here until #193 caught CI-only drift.
      tags: style
      priority: 7
      files: bin/branch-changes
      glob: "*.md"
      run: mise exec -- bundle exec rake markdown:check
      skip:
        - merge
        - rebase
    jactionlint:
      # The workflow audit's linter, offline here; CI adds the online checks. Same inputs as its paths.
      tags: style
      priority: 7
      files: bin/branch-changes
      glob: "{.github/**,mise.toml,mise.lock}"
      run: mise exec -- jactionlint
      skip:
        - merge
        - rebase
    rspec:
      tags: test
      priority: 8
      # CI=true keeps Capybara's 10s wait under a loaded hook (spec/support/capybara.rb). The full suite runs
      # in CI on every merge; bin/parallel-rspec runs it here by hand — see /docs/developer/testing.
      env:
        CI: "true"
      run: mise exec -- bin/test-plan --run
      skip:
        - merge
        - rebase
    docker_build:
      tags: build
      # Diffed against the base branch, not the push range, so a rebase replay still builds.
      # Same inputs as docker_build.yml's paths.
      files: bin/branch-changes
      glob: "{Dockerfile,.dockerignore,Gemfile,Gemfile.lock,.tool-versions,bin/docker-entrypoint}"
      run: mise exec -- bin/docker-build-check
      skip:
        - merge
        - rebase
    hotcell_build:
      tags: build
      priority: 9
      # The Hot Cell image, built only when hotcell/ changed; diffed like docker_build.
      files: bin/branch-changes
      glob: "hotcell/**"
      run: docker build --pull hotcell
      skip:
        - merge
        - rebase
