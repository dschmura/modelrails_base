# i18n-tasks config — drives spec/i18n_spec.rb (missing / unused / normalized).
# Reference: https://github.com/glebm/i18n-tasks

base_locale: en

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/**/*.%{locale}.yml
  # Keys added by `i18n-tasks add-missing` land here; the domain-split files
  # under config/locales/en/ are curated by hand.
  write:
    - config/locales/%{locale}.yml
  yaml:
    write:
      line_width: -1

search:
  paths:
    - app/
  relative_roots:
    - app/controllers
    - app/helpers
    - app/mailers
    - app/views
    - app/components
    - app/notifiers
  exclude:
    - app/assets
    # Markdown served at /docs. Contains illustrative `t(".key")` snippets that
    # are documentation, not call sites.
    - app/docs

ignore_unused:
  # Resolved dynamically at runtime, so no static call site exists.
  - notification_mailer.digest.subject.*
  # Consumed by Rails/Active Model rather than an explicit t() call.
  - activerecord.errors.*
  - errors.*
  - helpers.*
  - date.*
  - time.*
  - number.*
  - support.*
  # Read by JS through the clientside translation bridge.
  - clientside.*

ignore_missing:
  # Owned by mounted engines / the modelrails_ui gem, not by this app. Every
  # call site passes an inline `default:`, so an absent app key is intended —
  # a fork adds these only when it wants to override the shipped wording.
  - modelrails_ui.*
  - ui.*
  - biscuit.*
  - markdowndocs.*
  # `t(".key")` called from a private controller method. i18n-tasks resolves
  # the enclosing method name statically; Rails resolves `action_name` at
  # request time and falls back to controller scope. Listed call-site by
  # call-site rather than as a blanket rule so genuine misses still report.
  - invitation_accepts.find_valid_invitation.*
  - invitation_declines.find_valid_invitation.*
  - settings.profiles.handle_email_change.*
  - settings.profiles.handle_profile_update.*
  - workspaces.invitations.create_email_invitations.*
  - workspaces.invitations.create_magic_link.*
