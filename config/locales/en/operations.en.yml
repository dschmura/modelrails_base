en:
  operations:
    area:
      banner: "Instance operations — you are above the %{workspaces}, not inside one."
      nav_label: "Operations"
    # Bare `yes`/`no` parse as YAML booleans, not string keys — Psych would
    # turn `yes:` into a `true` key and break the t() lookup.
    affirmative: "Yes"
    negative: "No"
    nav:
      workspaces: "%{Workspaces}"
      users: "Users"
      activity: "Activity"
      operators: "Operators"
    workspaces:
      index:
        title: "%{Workspaces}"
        description: "Every %{workspace} on this instance, including locked and archived ones."
        caption: "All %{workspaces}"
        empty: "No %{workspaces} yet."
        new: "New %{workspace}"
        columns:
          name: "Name"
          status: "Status"
          owner: "Owner"
          members: "Members"
      show:
        status_prefix: "Status"
        members: "Members"
        no_members: "No members yet."
        suspend: "Lock this %{workspace}"
        suspend_confirm: "Members will be blocked until it is unlocked. Continue?"
        unsuspend: "Unlock this %{workspace}"
      new:
        title: "New %{workspace}"
        name: "Name"
        owner_email: "Owner's email address"
        submit: "Create %{workspace}"
      create:
        success: "%{Workspace} created."
      suspensions:
        create:
          success: "%{Workspace} locked."
        destroy:
          success: "%{Workspace} unlocked."
    users:
      index:
        title: "Users"
        description: "Look a user up by their exact email address."
        search_label: "Email address"
        search_placeholder: "someone@example.com"
        search: "Search"
        no_match: "No user has that email address."
      show:
        locked: "Locked"
        operator: "Operator"
        memberships: "Memberships"
        no_memberships: "No memberships yet."
        unlock: "Unlock account"
        suspend: "Suspend access"
        suspend_confirm: "Every session ends and every membership is deactivated. Continue?"
      locks:
        destroy:
          success: "Account unlocked."
      suspensions:
        create:
          success: "Access suspended."
    activity_logs:
      index:
        title: "Activity across the instance"
        description: "Newest first, every %{workspace}. Personal security events are not shown here."
        instance: "Instance"
    operatorships:
      index:
        title: "Operators"
        description: "Who can operate this instance."
        # _html: interpolates a <time> element — the suffix makes ActionView
        # auto-escape %{name} while passing the already-safe %{date} markup
        # through untouched.
        granted_by_html: "granted by %{name} on %{date}"
        bootstrap: "rake or seed"
        grant_label: "Grant operator access to (email)"
        grant: "Grant"
        revoke: "Revoke"
        revoke_aria_label: "Revoke %{name}'s operator access"
        revoke_confirm: "Revoke %{name}'s operator access?"
      create:
        success: "Operator access granted."
        already: "That user is already an operator."
        not_found: "No user has that email address."
        blank: "Enter an email address."
      destroy:
        success: "Operator access revoked."
        already_revoked: "That operator access was already revoked."
        last_operator: "The last operator cannot be revoked from here. Use rails operators:revoke on the server."
        self_revoke: "You cannot revoke your own operator access. Ask another operator to do it."
  # owner_email's error attaches to the FIELD, not :base, via Workspace's own
  # virtual attribute (see Workspace#owner_email). `invalid` is a fragment —
  # full_message prefixes the humanized attribute name below, so that value
  # must match the field's own label (operations.workspaces.new.owner_email)
  # or the error summary names a field the form doesn't. First app-level
  # override of a humanized attribute name — precedent, not a special case.
  activerecord:
    attributes:
      workspace:
        owner_email: "Owner's email address"
    errors:
      models:
        workspace:
          attributes:
            owner_email:
              invalid: "must be a valid email address"
