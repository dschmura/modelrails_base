en:
  operations:
    area:
      banner: "Instance operations — you are above the %{workspaces}, not inside one."
      nav_label: "Operations"
    # R19: bare `yes`/`no` parse as YAML booleans, not string keys — Psych
    # would turn `yes:` into a `true` key and break the t() lookup.
    affirmative: "Yes"
    negative: "No"
    nav:
      workspaces: "%{Workspaces}"
      users: "Users"
      activity: "Activity"
      operators: "Operators"
    workspaces:
      index:
        title: "%{Workspaces}"
        description: "Every %{workspace} on this instance, including locked and archived ones."
        caption: "All %{workspaces}"
        empty: "No %{workspaces} yet."
        new: "New %{workspace}"
        columns:
          name: "Name"
          status: "Status"
          owner: "Owner"
          members: "Members"
      show:
        status_prefix: "Status"
        members: "Members"
        no_members: "No members yet."
        suspend: "Lock this %{workspace}"
        suspend_confirm: "Members will be blocked until it is unlocked. Continue?"
        unsuspend: "Unlock this %{workspace}"
      new:
        title: "New %{workspace}"
        name: "Name"
        owner_email: "Owner's email address"
        owner_email_invalid: "Enter a valid email address for the owner."
        submit: "Create %{workspace}"
      create:
        success: "%{Workspace} created."
      suspensions:
        create:
          success: "%{Workspace} locked."
        destroy:
          success: "%{Workspace} unlocked."
    users:
      index:
        title: "Users"
        description: "Look a user up by their exact email address."
        search_label: "Email address"
        search_placeholder: "someone@example.com"
        search: "Search"
        no_match: "No user has that email address."
      show:
        locked: "Locked"
        operator: "Operator"
        memberships: "Memberships"
        no_memberships: "No memberships yet."
    activity_logs:
      index:
        title: "Activity across the instance"
        description: "Newest first, every %{workspace}. Personal security events are not shown here."
        instance: "Instance"
    operatorships:
      index:
        title: "Operators"
        description: "Who can operate this instance."
        # _html: interpolates a <time> element (fix round 3, item 2 / R27) —
        # the suffix makes ActionView auto-escape %{name} while passing the
        # already-safe %{date} markup through untouched.
        granted_by_html: "granted by %{name} on %{date}"
        bootstrap: "rake or seed"
