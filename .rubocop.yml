# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Existing size violations are grandfathered here (DES-15); the two Metrics cops
# below then hold NEW code to the limit. Shrink the todo as files are refactored.
inherit_from: .rubocop_todo.yml

# House cops (lib/rubocop): the playbook's shape rules made executable, on top
# of omakase's style. Each message says what broke, how to fix it, which
# pattern applies, and where to read more. See /docs/developer/extending.
require:
  - ./lib/rubocop/modelrails

# A file under app/models/<model>/ defines its trait in nested form.
ModelRails/ModelConcernNamespace:
  Enabled: true
  Include:
    - "app/models/*/**/*.rb"

# Tenant scoping is opt-in; no model installs a default_scope.
ModelRails/NoDefaultScope:
  Enabled: true
  Include:
    - "app/models/**/*.rb"

# A system spec waits for observable state, never for a clock.
ModelRails/NoSleepInSystemSpecs:
  Enabled: true
  Include:
    - "spec/system/**/*.rb"

# A translation call carries no inline default. The vendored UI primitives
# (rails g modelrails_ui:add) keep the fallbacks the gem ships with — they are
# the gem's files, regenerated by its installer, not the app's copy. Views are
# covered by .erb_lint.yml's Rubocop linter running this one cop.
ModelRails/NoI18nDefault:
  Enabled: true
  Include:
    - "app/**/*.rb"
  Exclude:
    - "app/components/ui/**/*"

# The signed-in user is Current.user. The one current_user definition is the
# bridge Pundit and the mounted engines call, on ApplicationController.
ModelRails/NoCurrentUserShim:
  Enabled: true
  Include:
    - "app/**/*.rb"
  Exclude:
    - "app/controllers/application_controller.rb"

# The stack floor: Rails 8.1+, Propshaft, import maps, Hotwire, built-in auth,
# the Solid trio. A Gemfile line that brings in what the floor replaces fails.
ModelRails/StackFloor:
  Enabled: true
  Include:
    - "**/Gemfile"

# Every routed action is one of the seven. ApplicationController is abstract:
# no route reaches it, and its public methods are helper_method exposures.
ModelRails/RestfulActions:
  Enabled: true
  Include:
    - "app/controllers/**/*_controller.rb"
  Exclude:
    - "app/controllers/application_controller.rb"

# So the policy Excludes below (migrations, specs) merge with the todo's
# grandfather Excludes instead of one clobbering the other.
inherit_mode:
  merge:
    - Exclude

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# DES-15 — omakase disables the Metrics department; re-enable the two cops that
# catch the size problems the audit found (81-line actions, 300+-line god
# objects) so the next one fails the PR, not a future audit. Thresholds are
# deliberately lenient — the point is a ceiling on runaway growth, not omakase's
# stricter defaults. Current app violators are grandfathered in .rubocop_todo.yml.
# Migrations and specs are exempt by policy — their length norms differ, and a
# forker writing a long data-migration `def` shouldn't fight the linter.
Metrics/MethodLength:
  Enabled: true
  Max: 25
  Exclude:
    - "db/migrate/**/*"
    - "spec/**/*"

Metrics/ClassLength:
  Enabled: true
  Max: 250
  Exclude:
    - "db/migrate/**/*"
    - "spec/**/*"
