name: Image Scan

# Builds the production image from scratch and scans its OS packages; it is also a build-input PR's image build.
# Weekly too, because base-image CVEs land without a commit. Accepted findings: .trivyignore. /docs/developer/testing

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Gemfile"
      - "Gemfile.lock"
      - ".tool-versions"
      - "bin/docker-entrypoint"
      - ".trivyignore"
      - ".github/workflows/image_scan.yml"
  workflow_dispatch:

# Least-privilege default: the scan builds locally (push: false) and reports
# via job status only — no SARIF upload, no writes.
permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan_image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Always cold: a cached build can replay a stale apt layer and fake a CVE (#536, /docs/developer/testing).
      # load: true puts the image in the local daemon, so Trivy has something to scan.
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          no-cache: true
          platforms: linux/amd64
          tags: modelrails_base:scan-${{ github.sha }}

      # ignore-unfixed: Debian-stable bases always carry CVEs with no fixed
      # package yet; gating on them would make this permanently red and
      # trained-away. The gate is "a fix exists and we haven't taken it".
      - name: Scan for HIGH/CRITICAL CVEs with a fix available
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: modelrails_base:scan-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
