# Audits the workflow tree with zizmor, pinned so the auditor never floats; Dependabot bumps
# setup-uv, the zizmor version is bumped by hand. A suppression is an inline `# zizmor: ignore[rule]`.

name: Workflow audit

on:
  pull_request:
    paths:
      - ".github/**"
  schedule:
    # Weekly Monday sweep: new zizmor releases are pinned, so this catches
    # drift introduced by merged PRs, not new-rule churn.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Audit the workflow tree
        run: uvx zizmor==1.29.0 .github/workflows/
