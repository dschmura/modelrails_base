name: CI

on:
  pull_request:
  push:
    branches: [ next, main ]

# A newer push to a PR supersedes its run; each push to next or main gets its own group,
# since a shared one would cancel a queued run and leave that merge unchecked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for every job: nothing here pushes, uploads SARIF,
# or writes statuses (docker builds run with push: false).
permissions:
  contents: read

jobs:
  # Every static check in one job: one billed runner minute, not four. Each check step runs even after an
  # earlier one fails, so a push still reports every failing check. /docs/developer/getting-started (Gate 2)
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The comment-block gate diffs the PR against its base, so it needs history.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Install libvips (loaded at Rails boot via active_storage_validations)
        timeout-minutes: 5
        uses: ./.github/actions/apt-packages
        with:
          packages: libvips42t64

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.tool-versions', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Scan for common Rails security vulnerabilities using static analysis
        if: ${{ !cancelled() }}
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        if: ${{ !cancelled() }}
        run: bin/bundler-audit

      - name: Scan for known security vulnerabilities in the Hot Cell image's gems
        if: ${{ !cancelled() }}
        run: bin/bundler-audit check hotcell

      - name: Scan for security vulnerabilities in JavaScript dependencies
        if: ${{ !cancelled() }}
        run: |
          for i in 1 2 3; do bin/importmap audit && exit 0; [ "$i" -lt 3 ] && sleep $((i * 20)); done
          echo "::error::REGISTRY UNREACHABLE after 3 attempts — audit did not run (#984)"; exit 1

      - name: Lint code for consistent style
        if: ${{ !cancelled() }}
        run: bin/rubocop -f github

      - name: Refuse comment blocks over two lines in the pull request's diff
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bin/comment-block-check --range "origin/${BASE_REF}...HEAD"

      - name: Refuse changes to shipped release notes
        if: ${{ !cancelled() }}
        run: bin/release check

      - name: Check markdown
        if: ${{ !cancelled() }}
        run: bundle exec rake markdown:check

      - name: Check ERB templates
        if: ${{ !cancelled() }}
        run: bundle exec rake erb:check

  # A pull request's change lanes pick lane_specs or the full shards; every push runs the shards.
  # bin/test-plan is stdlib-only, so this runs before bundle install. /docs/developer/testing
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full || steps.push.outputs.full }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: false

      - name: Classify the pull request's changes
        id: plan
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bin/test-plan --github-output --base "origin/${BASE_REF}"

      - name: Every push runs the full suite
        id: push
        if: github.event_name != 'pull_request'
        run: echo "full=true" >> "$GITHUB_OUTPUT"

  # Sharded test matrix (#495, PR #615), shaped by the CI_SHARDS and CI_WORKERS repository
  # variables; the cross-shard checks run once in the test job. /docs/developer/testing
  split_seed:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      total: ${{ steps.shape.outputs.total }}
      indices: ${{ steps.shape.outputs.indices }}
    steps:
      - name: Publish the shard count (CI_SHARDS repository variable, default 8)
        id: shape
        env:
          CI_SHARDS: ${{ vars.CI_SHARDS || 8 }}
        run: |
          echo "total=$CI_SHARDS" >> "$GITHUB_OUTPUT"
          echo "indices=$(jq -cn --argjson n "$CI_SHARDS" '[range($n)]')" >> "$GITHUB_OUTPUT"

      - name: Restore recorded spec runtimes
        # The unique per-sha key always misses on a fresh commit, so
        # restore-keys pulls the newest prior log — on a PR that resolves to
        # the base branch's latest. A miss is harmless: shards fall back to a
        # file-size split.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.sha }}
          restore-keys: |
            parallel-runtime-

      - name: Ensure a seed file exists (cache miss = empty seed)
        run: mkdir -p tmp && touch tmp/parallel_runtime_rspec.log

      - name: Publish the frozen split seed
        # One snapshot, downloaded by every shard: the shard split MUST be
        # computed from identical input or shards overlap and leave holes
        # (caught locally while building this — see bin/parallel-rspec).
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: split-seed
          path: tmp/parallel_runtime_rspec.log
          retention-days: 1
          if-no-files-found: error

  test_shard:
    needs: [ changes, split_seed ]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.split_seed.outputs.indices) }}
    env:
      RAILS_ENV: test
      CI: true
      # Workers per shard: the public runner's 4 vCPUs unless CI_WORKERS says otherwise.
      PARALLEL_TEST_PROCESSORS: ${{ vars.CI_WORKERS || 4 }}
      CI_SHARD_INDEX: ${{ matrix.shard }}
      CI_SHARD_TOTAL: ${{ needs.split_seed.outputs.total }}
      # #740: parallel db:prepare on a fresh runner races railties'
      # non-atomic generate_local_secret (tmp/local_secret.txt) — a reader can
      # binread "" mid-write and fail boot. A fixed test-only value skips the
      # file path entirely. Not a secret: test env, throwaway DBs.
      SECRET_KEY_BASE: ci-test-only-dummy-secret-key-base-not-used-anywhere-real
      SHARD_RUNTIME_SOURCE: tmp/runtime_seed.log

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Install libvips (Active Storage image variants)
        timeout-minutes: 5
        uses: ./.github/actions/apt-packages
        with:
          packages: libvips42t64 libheif-plugin-libde265

      - name: Verify Chrome is available (Cuprite/ferrum connects to the runner's pre-installed browser)
        # No install step: ubuntu-latest ships Google Chrome pre-installed and
        # ferrum auto-detects it (no Node/npm involved). This check converts a
        # silent runner-image assumption into a fast, explicit, loudly-failing
        # one — if a future image ever drops Chrome, this step names the exact
        # problem instead of 100+ confusing system-spec driver errors.
        run: google-chrome --version || chromium-browser --version || chromium --version

      - name: Set up gem source symlinks for Tailwind
        run: bundle exec rake tailwind:setup_gem_sources

      - name: Compile assets
        run: bin/rails assets:precompile

      - name: Download the frozen split seed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: split-seed
          path: tmp/seed/

      - name: Place the seed where SHARD_RUNTIME_SOURCE points
        run: cp tmp/seed/parallel_runtime_rspec.log tmp/runtime_seed.log

      - name: Restore recorded spec runtimes (seeds the IN-shard worker split)
        # Separate from the frozen shard seed: this live log balances the IN-shard workers, the
        # seed balances files ACROSS shards. Restore-only — the test job saves the reassembled log.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.sha }}
          restore-keys: |
            parallel-runtime-

      - name: Run tests (shard ${{ matrix.shard }} of ${{ needs.split_seed.outputs.total }})
        # Shard slice + in-shard workers + per-shard example-count parity; the merged 90% coverage
        # floor runs once, across all shards, in the test job — see bin/parallel-rspec.
        run: bin/parallel-rspec

      - name: Upload test screenshots on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: system-test-screenshots-shard-${{ matrix.shard }}
          path: tmp/capybara/
          retention-days: 7

      - name: Package shard results for the merge job
        # The resultset is RENAMED on the way out: upload-artifact excludes
        # hidden files by default, so `.resultset.json` silently vanished
        # from the artifact on this PR's first run while its visible
        # siblings uploaded fine (coverage_merge caught it: found 0/2).
        if: always()
        run: |
          mkdir -p tmp/shard_out
          cp coverage/.resultset.json tmp/shard_out/resultset.json 2>/dev/null || true
          cp tmp/shard_files.txt tmp/shard_out/ 2>/dev/null || true
          cp tmp/parallel_runtime_rspec.log tmp/shard_out/ 2>/dev/null || true

      - name: Upload shard results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-shard-${{ matrix.shard }}
          path: tmp/shard_out/
          retention-days: 7

  # A lane-only pull request: a shard's setup on one runner, running only its lanes' specs.
  lane_specs:
    needs: changes
    if: needs.changes.outputs.full == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILS_ENV: test
      CI: true
      SECRET_KEY_BASE: ci-test-only-dummy-secret-key-base-not-used-anywhere-real

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Install libvips (Active Storage image variants)
        timeout-minutes: 5
        uses: ./.github/actions/apt-packages
        with:
          packages: libvips42t64 libheif-plugin-libde265

      - name: Verify Chrome is available (Cuprite/ferrum connects to the runner's pre-installed browser)
        run: google-chrome --version || chromium-browser --version || chromium --version

      - name: Set up gem source symlinks for Tailwind
        run: bundle exec rake tailwind:setup_gem_sources

      - name: Compile assets
        run: bin/rails assets:precompile

      - name: Run the specs the change lanes select
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bin/test-plan --run --base "origin/${BASE_REF}"

      - name: Upload test screenshots on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: system-test-screenshots-lanes
          path: tmp/capybara/
          retention-days: 7

  # The ruleset requires `test` by name; `always()` keeps a failed run from skipping it, which would pass.
  test:
    needs: [ changes, test_shard, lane_specs ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILS_ENV: test

    steps:
      - name: The full suite or the change's lane specs succeeded
        id: shards
        env:
          FULL: ${{ needs.changes.outputs.full }}
          SHARDS: ${{ needs.test_shard.result }}
          LANE: ${{ needs.lane_specs.result }}
        run: |
          if [ "$FULL" = true ]; then want="$SHARDS"; else want="$LANE"; fi
          [ "$want" = success ] || { echo "full=$FULL shards=$SHARDS lane=$LANE"; exit 1; }

      - name: Checkout code
        if: needs.changes.outputs.full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        if: needs.changes.outputs.full == 'true'
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Download every shard's results
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-*
          path: tmp/shards/

      - name: Merge shards — union parity, 90% coverage floor, runtime log
        if: needs.changes.outputs.full == 'true'
        # bundle exec: CI's gems live in vendor/bundle (bundler-cache), so a
        # bare ruby script can't require simplecov (run 2's LoadError).
        run: bundle exec bin/ci-coverage-merge tmp/shards

      - name: Upload merged coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.shards.outcome == 'success' && needs.changes.outputs.full == 'true'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Save the reassembled runtime log for future splits
        if: needs.changes.outputs.full == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.sha }}
